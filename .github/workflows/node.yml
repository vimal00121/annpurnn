name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all JavaScript
        run: |
          find server tests public -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run API test suite
        run: npm test

      - name: Smoke start server
        run: |
          node server/seed.js
          node server/index.js &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:3000/api/meta/areas > /dev/null
          curl -fsS http://127.0.0.1:3000/ | grep -q ANNPURNN
          kill $SERVER_PID
