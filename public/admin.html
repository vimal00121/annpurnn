<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e3d12">
<title>ANNPURNN Admin</title>
<link rel="icon" href="/img/favicon-64.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<style>
  .adminnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .adminnav button { border: 1.5px solid var(--green); background: #fff; color: var(--green-dark); border-radius: 999px; padding: 7px 14px; font-weight: 700; cursor: pointer; }
  .adminnav button.active { background: var(--green); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e4ead9; }
  th { background: var(--green-soft); color: var(--green-dark); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: #fff; border: 1px solid #e4ead9; border-radius: 14px; padding: 12px; }
  .stat b { display: block; font-size: 22px; color: var(--green-dark); }
  kpi { }
</style>
</head>
<body>
<header class="topbar">
  <a href="/admin" class="brand"><img src="/img/emblem.png" alt="" width="34" height="34" class="brand-emblem">
    <span>ANNPURNN<br><small>Admin &amp; Moderation</small></span></a>
  <div class="topbar-actions"><button id="logout" class="chip">Logout</button></div>
</header>
<main>
  <div id="loginBox" class="card" hidden>
    <h2>Admin login</h2>
    <div class="field"><label>Mobile number</label><input id="phone" type="tel" placeholder="98XXXXXXXX"></div>
    <button class="btn primary" id="getOtp">Get OTP</button>
    <div class="field" hidden id="otpWrap"><label>OTP</label><input id="otp" maxlength="6" inputmode="numeric"></div>
    <button class="btn gold" id="doLogin" hidden>Verify &amp; login</button>
    <div id="authMsg"></div>
  </div>
  <div id="panel" hidden>
    <div class="adminnav" id="nav"></div>
    <div id="content"></div>
  </div>
</main>
<script>
let TOKEN = sessionStorage.getItem('annpurnn_admin_token') || null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

const SECTIONS = [
  ['analytics', '📊 Analytics'], ['users', '👥 Users'], ['requests', '🍲 Requests'],
  ['donations', '🤲 Donations'], ['reports', '🚩 Complaints'], ['community', '💬 Community chat'],
  ['audit', '🧾 Audit log']
];

function drawNav(active) {
  $('nav').innerHTML = SECTIONS.map(([k, label]) =>
    `<button data-k="${k}" class="${k === active ? 'active' : ''}">${label}</button>`).join('');
  $('nav').querySelectorAll('button').forEach((b) => b.onclick = () => show(b.dataset.k));
}

async function show(section) {
  drawNav(section);
  const c = $('content');
  c.innerHTML = '<div class="muted">Loading…</div>';
  try {
    if (section === 'analytics') {
      const a = await api('GET', '/api/admin/analytics');
      const items = [
        ['Daily active users', a.daily_active_users], ['Monthly active users', a.monthly_active_users],
        ['Requests created', a.requests_created], ['Requests fulfilled', a.requests_fulfilled],
        ['Avg fulfilment (hrs)', a.avg_fulfilment_hours], ['Active donors (30d)', a.active_donors],
        ['Repeat donors', a.repeat_donors], ['Helper-created requests', a.helper_created_requests],
        ['Successful collections', a.successful_collections], ['Cancellations', a.cancellations],
        ['Community messages', a.community_messages], ['Open reports', a.open_reports]
      ];
      c.innerHTML = `<div class="stats">${items.map(([k, v]) => `<div class="stat"><b>${esc(v)}</b>${esc(k)}</div>`).join('')}</div>`;
    } else if (section === 'users') {
      const { users } = await api('GET', '/api/admin/users');
      c.innerHTML = `<table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Roles</th><th>Status</th><th>Verified</th><th></th></tr>
        ${users.map((u) => `<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.phone)}</td>
          <td>${esc(u.roles)}</td><td>${esc(u.status)}</td>
          <td>${u.phone_verified ? '📱' : ''}${u.donor_verified ? ' 🤲' : ''}${u.helper_verified ? ' 🤝' : ''}</td>
          <td>
            <button onclick="verifyUser(${u.id},'donor',${u.donor_verified ? 0 : 1})">${u.donor_verified ? 'Unverify donor' : 'Verify donor'}</button>
            <button onclick="verifyUser(${u.id},'helper',${u.helper_verified ? 0 : 1})">${u.helper_verified ? 'Unverify helper' : 'Verify helper'}</button>
            <button onclick="setStatus(${u.id},'${u.status === 'active' ? 'suspended' : 'active'}')">${u.status === 'active' ? 'Suspend' : 'Reactivate'}</button>
          </td></tr>`).join('')}</table>`;
    } else if (section === 'requests') {
      const { requests } = await api('GET', '/api/admin/requests');
      c.innerHTML = `<table><tr><th>Code</th><th>Food</th><th>People</th><th>Area</th><th>Status</th><th>Helper</th><th>Created</th></tr>
        ${requests.map((r) => `<tr><td>${esc(r.code)}</td><td>${esc(r.food_desc.slice(0, 40))}</td>
          <td>${r.people_count}</td><td>${esc(r.area)}</td><td>${esc(r.status)}</td>
          <td>${r.created_by_helper ? '🤝' : ''}</td><td>${esc(r.created_at)}</td></tr>`).join('')}</table>`;
    } else if (section === 'donations') {
      const { donations } = await api('GET', '/api/admin/donations');
      c.innerHTML = `<table><tr><th>Code</th><th>Title</th><th>Donor</th><th>Status</th><th>Safety</th><th></th></tr>
        ${donations.map((d) => `<tr><td>${esc(d.code)}</td><td>${esc(d.title)}</td><td>${esc(d.donor_name)}</td>
          <td>${esc(d.status)}</td><td>${esc(d.safety_review)}</td>
          <td><button onclick="review(${d.id},'passed')">Pass</button> <button onclick="review(${d.id},'rejected')">Reject</button></td></tr>`).join('')}</table>`;
    } else if (section === 'reports') {
      const { reports } = await api('GET', '/api/admin/reports');
      c.innerHTML = `<table><tr><th>#</th><th>Type</th><th>Target</th><th>Category</th><th>Reporter</th><th>Status</th><th></th></tr>
        ${reports.map((r) => `<tr><td>${r.id}</td><td>${esc(r.target_type)}</td><td>${r.target_id}</td>
          <td>${esc(r.category)}</td><td>${esc(r.reporter_name || '—')}</td><td>${esc(r.status)}</td>
          <td><button onclick="handleReport(${r.id},'reviewing')">Review</button>
          <button onclick="handleReport(${r.id},'resolved')">Resolve</button>
          <button onclick="handleReport(${r.id},'dismissed')">Dismiss</button></td></tr>`).join('')}</table>`;
    } else if (section === 'community') {
      const { messages } = await api('GET', '/api/admin/community');
      c.innerHTML = `<h3>Community chat messages</h3>
        <table><tr><th>#</th><th>Time</th><th>Sender</th><th>Message</th><th>Flagged</th><th>Status</th><th></th></tr>
        ${messages.map((m) => `<tr><td>${m.id}</td><td>${esc(m.created_at)}</td><td>${esc(m.sender_name)}</td>
          <td>${esc(m.body)}</td><td>${m.flagged ? '🚩' : ''}</td>
          <td>${m.removed ? '🗑\uFE0F removed' : 'visible'}</td>
          <td>${m.removed ? '' : `<button onclick="removeCommunity(${m.id})">Remove</button>`}</td></tr>`).join('')}</table>`;
    } else if (section === 'audit') {
      const { audit } = await api('GET', '/api/admin/audit');
      c.innerHTML = `<table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>IP</th></tr>
        ${audit.map((a) => `<tr><td>${esc(a.created_at)}</td><td>${esc(a.actor_name || a.actor_id || 'system')}</td>
          <td>${esc(a.action)}</td><td>${esc(a.entity_type || '')} ${a.entity_id ?? ''}</td><td>${esc(a.ip || '')}</td></tr>`).join('')}</table>`;
    }
  } catch (e) {
    c.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

window.verifyUser = async (id, kind, val) => {
  await api('PATCH', '/api/admin/users/' + id, kind === 'donor' ? { donor_verified: !!val } : { helper_verified: !!val });
  show('users');
};
window.setStatus = async (id, status) => {
  await api('PATCH', '/api/admin/users/' + id, { status });
  show('users');
};
window.review = async (id, safety_review) => {
  await api('PATCH', `/api/admin/donations/${id}/safety-review`, { safety_review, note: '' });
  show('donations');
};
window.removeCommunity = async (id) => {
  await api('DELETE', '/api/admin/community/' + id);
  show('community');
};
window.handleReport = async (id, status) => {
  await api('PATCH', '/api/admin/reports/' + id, { status, note: '' });
  show('reports');
};

$('getOtp').onclick = async () => {
  try {
    const r = await api('POST', '/api/auth/otp/request', { phone: $('phone').value.trim() });
    $('otpWrap').hidden = false; $('doLogin').hidden = false;
    $('authMsg').innerHTML = `<div class="okmsg">OTP sent${r.dev_otp ? ' (dev: ' + r.dev_otp + ')' : ''}</div>`;
  } catch (e) { $('authMsg').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
};
$('doLogin').onclick = async () => {
  try {
    const r = await api('POST', '/api/auth/otp/verify', { phone: $('phone').value.trim(), code: $('otp').value.trim(), roles: ['admin'] });
    if (!r.user.roles.includes('admin')) throw new Error('This account is not an admin.');
    TOKEN = r.token;
    sessionStorage.setItem('annpurnn_admin_token', TOKEN);
    $('loginBox').hidden = true; $('panel').hidden = false;
    show('analytics');
  } catch (e) { $('authMsg').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
};
$('logout').onclick = () => { sessionStorage.removeItem('annpurnn_admin_token'); location.reload(); };

(async function init() {
  if (TOKEN) {
    try {
      const me = await api('GET', '/api/me');
      if (me.user && me.user.roles.includes('admin')) {
        $('loginBox').hidden = true; $('panel').hidden = false;
        show('analytics');
        return;
      }
    } catch (e) { TOKEN = null; }
  }
  $('loginBox').hidden = false;
})();
</script>
</body>
</html>
